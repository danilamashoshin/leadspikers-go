<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Мини-курс Leadspikers в Telegram</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101213; color: #f7f8f4; }
    main { box-sizing: border-box; width: min(100%, 34rem); padding: 2rem; }
    h1 { letter-spacing: -.04em; }
    p { color: #c8cdc6; }
    a { display: inline-block; padding: .9rem 1.2rem; border-radius: .7rem; background: #ceff42; color: #171b0a; font-weight: 750; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Мини-курс Leadspikers</h1>
    <p>Если Telegram не открылся автоматически, нажмите кнопку.</p>
    <a id="open-telegram" href="https://t.me/LS_education_bot?start=go" rel="noreferrer">Открыть Telegram</a>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var ref = params.get('ref') || '';
      var clickId = params.get('fbclid') || '';
      var start = /^[A-Za-z0-9_-]{1,64}$/.test(ref) ? ref : 'go';
      var target = new URL('https://t.me/LS_education_bot');
      target.searchParams.set('start', start);
      var yclid = params.get('yclid') || '';
      var hasYclid = /^[0-9]{1,32}$/.test(yclid);
      var fromYandex = params.get('source') === 'yandex' || hasYclid;
      if (fromYandex) {
        target = new URL('https://learn.leadspikers.com/yandex-telegram.php');
        target.searchParams.set('ref', start);
        if (hasYclid) target.searchParams.set('yclid', yclid);
        var existingClientId = document.cookie.match(/(?:^|;\s*)_ym_uid=([0-9]{1,32})(?:;|$)/);
        if (existingClientId) target.searchParams.set('client_id', existingClientId[1]);
      } else if (/^[A-Za-z0-9_-]{8,512}$/.test(clickId)) {
        target = new URL('https://learn.leadspikers.com/meta-telegram.php');
        target.searchParams.set('ref', start);
        target.searchParams.set('fbclid', clickId);
      }
      var button = document.getElementById('open-telegram');
      button.href = target.href;
      var leaving = false;
      function openTelegram() {
        if (leaving) return;
        leaving = true;
        clearTimeout(redirect);
        location.replace(target.href);
      }

      var redirect = setTimeout(openTelegram, fromYandex ? 1800 : 350);
      button.addEventListener('click', function () {
        leaving = true;
        clearTimeout(redirect);
      });
      if (fromYandex) {
        var hitKey = 'ls_yandex_telegram_hit_v1';
        var metrika = document.createElement('script');
        metrika.src = 'metrika.js';
        metrika.onload = function () {
          var hitSent = false;
          try { hitSent = localStorage.getItem(hitKey) === '1'; } catch (error) {}
          if (!hitSent) {
            var measuredUrl = new URL(location.href);
            measuredUrl.searchParams.delete('source');
            measuredUrl.search = '?source=yandex' + (measuredUrl.search ? '&' + measuredUrl.search.slice(1) : '');
            window.ym(114655053, 'hit', measuredUrl.href, {
              callback: function () {
                try { localStorage.setItem(hitKey, '1'); } catch (error) {}
                if (hasYclid && target.searchParams.has('client_id')) openTelegram();
              }
            });
          }
          if (!target.searchParams.has('client_id')) {
            window.ym(114655053, 'getClientID', function (clientId) {
              if (leaving || !/^[0-9]{1,32}$/.test(String(clientId || ''))) return;
              target.searchParams.set('client_id', clientId);
              button.href = target.href;
              if (hasYclid && hitSent) openTelegram();
            });
          }
        };
        document.head.appendChild(metrika);
      }
    })();
  </script>
</body>
</html>
